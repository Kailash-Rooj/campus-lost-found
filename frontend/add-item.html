<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Item - Campus Lost & Found</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-dark bg-primary shadow-sm">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="index.html"
            >
                <i class="bi bi-search-heart-fill me-2"></i>
                Campus Lost & Found
            </a>

            <a
                href="index.html"
                class="btn btn-light"
            >
                <i class="bi bi-house me-1"></i>
                Home
            </a>

        </div>

    </nav>


    <!-- FORM -->

    <main class="container py-5">

        <div class="add-form">

            <div class="text-center mb-4">

                <i class="bi bi-plus-circle-fill text-primary fs-1"></i>

                <h2 class="fw-bold mt-2">
                    Add Lost / Found Item
                </h2>

                <p class="text-muted">
                    Enter the details of the item
                </p>

            </div>


            <form id="addItemForm">

                <!-- Item Name -->

                <div class="mb-3">

                    <label
                        for="itemName"
                        class="form-label fw-semibold"
                    >
                        Item Name
                    </label>

                    <input
                        type="text"
                        id="itemName"
                        class="form-control"
                        placeholder="e.g. Black Wallet"
                        required
                    >

                </div>


                <!-- Type -->

                <div class="mb-3">

                    <label
                        for="itemType"
                        class="form-label fw-semibold"
                    >
                        Type
                    </label>

                    <select
                        id="itemType"
                        class="form-select"
                        required
                    >

                        <option value="" selected disabled>
                            Select type
                        </option>

                        <option value="Lost">
                            Lost
                        </option>

                        <option value="Found">
                            Found
                        </option>

                    </select>

                </div>


                <!-- Location -->

                <div class="mb-3">

                    <label
                        for="itemLocation"
                        class="form-label fw-semibold"
                    >
                        Location
                    </label>

                    <input
                        type="text"
                        id="itemLocation"
                        class="form-control"
                        placeholder="e.g. College Library"
                        required
                    >

                </div>


                <!-- Date -->

                <div class="mb-3">

                    <label
                        for="itemDate"
                        class="form-label fw-semibold"
                    >
                        Date
                    </label>

                    <input
                        type="date"
                        id="itemDate"
                        class="form-control"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="mb-3">

                    <label
                        for="itemEmail"
                        class="form-label fw-semibold"
                    >
                        Contact Email
                    </label>

                    <input
                        type="email"
                        id="itemEmail"
                        class="form-control"
                        placeholder="example@gmail.com"
                        required
                    >

                </div>


                <!-- Description -->

                <div class="mb-4">

                    <label
                        for="itemDescription"
                        class="form-label fw-semibold"
                    >
                        Description
                    </label>

                    <textarea
                        id="itemDescription"
                        class="form-control"
                        rows="4"
                        placeholder="Describe the item..."
                        required
                    ></textarea>

                </div>


                <!-- Buttons -->

                <div class="d-flex gap-2">

                    <a
                        href="index.html"
                        class="btn btn-secondary flex-fill"
                    >
                        <i class="bi bi-arrow-left me-1"></i>
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary flex-fill"
                    >
                        <i class="bi bi-plus-lg me-1"></i>
                        Add Item
                    </button>

                </div>

            </form>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="bg-dark text-white text-center py-4 mt-auto">

        <div class="container">

            <p class="mb-1">
                <i class="bi bi-search-heart me-2"></i>
                Campus Lost & Found
            </p>

            <small class="text-secondary">
                Helping students find lost items
            </small>

        </div>

    </footer>


    <script src="script.js"></script>

</body>

</html>
