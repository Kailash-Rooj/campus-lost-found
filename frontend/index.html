<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Lost & Found</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-dark bg-primary shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-search-heart-fill me-2"></i>
                Campus Lost & Found 
            </a>

            <a href="add-item.html" class="btn btn-light">
                <i class="bi bi-plus-lg me-1"></i>
                Add Item
            </a>

        </div>

    </nav>


    <!-- MAIN -->

    <main class="container py-5">

        <!-- TITLE -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h3 class="fw-bold mb-0">
                Lost & Found Items
            </h3>

            <span
                id="itemCount"
                class="badge text-bg-secondary"
            >
                0 Items
            </span>

        </div>


        <!-- ITEMS -->

        <div
            id="itemsContainer"
            class="row g-4"
        >

        </div>


        <!-- EMPTY STATE -->

        <div
            id="emptyState"
            class="text-center py-5 d-none"
        >

            <div class="empty-icon mb-3">

                <i class="bi bi-inbox"></i>

            </div>

            <h5 class="fw-bold">
                No items found
            </h5>

            <p class="text-muted">
                No lost or found items have been added yet.
            </p>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="bg-dark text-white text-center py-4">

        <div class="container">

            <p class="mb-1">
                <i class="bi bi-search-heart me-2"></i>
                Campus Lost & Found
            </p>
            <b style="color: antiquewhite;">Find what you've lost or help someone find their item.</b>

        </div>

    </footer>


    <script src="script.js"></script>

</body>

</html>
